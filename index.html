/* Concepto: el mapa es el instrumento. Todo lo demás es una regla de campo que se desliza encima.
   Tipografía de señalética (Barlow Condensed) para nombres y códigos, Barlow para leer, Plex Mono para cifras. */
:root {
  --paper: #edf2f1;
  --surface: #fbfdfc;
  --surface-2: #f2f6f5;
  --ink: #12303a;
  --ink-2: #4d6a73;
  --line: #c8d7d6;
  --accent: #0a6c84;
  --accent-ink: #ffffff;
  --accent-soft: #d6ebef;
  --rain: #2c74c9;
  --rain-soft: rgba(44, 116, 201, .18);
  --sea: #d3e4ea;
  --land: #e9efe6;
  --land-2: #dfe5dc;
  --dep-line: #8fa8a6;
  --ok: #1d8a4e;
  --warn: #b97300;
  --bad: #c0352d;
  --maint: #7556c4;
  --off: #87959a;
  --cmp: #c77d12;
  --shadow: 0 10px 30px rgba(16, 46, 56, .14), 0 2px 6px rgba(16, 46, 56, .08);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b161b; --surface: #11212a; --surface-2: #0f1c23; --ink: #e1eef0; --ink-2: #92aab1;
    --line: #23404a; --accent: #4fc2d8; --accent-ink: #062027; --accent-soft: #143845;
    --rain: #63a8f2; --rain-soft: rgba(99, 168, 242, .22); --sea: #0a1419; --land: #17282d; --land-2: #13221f;
    --dep-line: #3f6068; --ok: #47c47c; --warn: #e8a63a; --bad: #ef6a5f; --maint: #a68ef0; --off: #6d7d82; --cmp: #f0a640;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b161b; --surface: #11212a; --surface-2: #0f1c23; --ink: #e1eef0; --ink-2: #92aab1;
  --line: #23404a; --accent: #4fc2d8; --accent-ink: #062027; --accent-soft: #143845;
  --rain: #63a8f2; --rain-soft: rgba(99, 168, 242, .22); --sea: #0a1419; --land: #17282d; --land-2: #13221f;
  --dep-line: #3f6068; --ok: #47c47c; --warn: #e8a63a; --bad: #ef6a5f; --maint: #a68ef0; --off: #6d7d82; --cmp: #f0a640;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field select, .field textarea, .inp { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2); }
.field textarea { min-height: 90px; resize: vertical; font-family: var(--f-mono); font-size: 13px; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field small { color: var(--ink-2); font-size: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.with-btn { display: flex; gap: 6px; }
.with-btn input { flex: 1; min-width: 0; }
.err { color: var(--bad); font-size: 13px; min-height: 1em; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px; }
.note.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* ---------- Ingreso ---------- */
#login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.login-art { position: relative; background: var(--sea); overflow: hidden; display: grid; place-items: center; padding: 24px; }
.login-art svg { width: min(100%, 520px); height: auto; }
.login-art .dep { fill: var(--land); stroke: var(--dep-line); stroke-width: .06; }
.login-art .nb { fill: var(--land-2); stroke: none; opacity: .7; }
.login-art .iso { fill: none; stroke: var(--rain); stroke-width: .05; opacity: .55; }
.login-art .cap { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; right: 16px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.login-side { display: grid; align-content: center; gap: 22px; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-box { width: min(100%, 400px); justify-self: center; display: grid; gap: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 44px; letter-spacing: .08em; line-height: 1; }
.brand i { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.login-box p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.login-box form { display: grid; gap: 12px; }

/* ---------- App ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--line); background: var(--surface);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 1001; }
.topbar .brand b { font-size: 26px; }
.topbar .brand i { display: none; }
.topbar .spacer { flex: 1; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.basemaps { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.basemaps button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.basemaps button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.usermenu { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; display: grid; }
.menu button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.stage { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--sea); }

/* Mapa vectorial (funciona sin internet) */
.leaflet-container { font-family: var(--f-body); background: var(--sea); }
.dep { fill: var(--land); fill-opacity: 1; stroke: var(--dep-line); stroke-width: 1; transition: fill .15s; }
.nb { fill: var(--land-2); fill-opacity: 1; stroke: var(--dep-line); stroke-width: .6; stroke-dasharray: 3 3; }
.tiles-on .dep { fill-opacity: 0; stroke: var(--accent); stroke-opacity: .55; }
.tiles-on .nb { fill-opacity: 0; stroke-opacity: 0; }
.dep:hover { fill: var(--accent-soft); }
.tiles-on .dep:hover { fill: var(--accent); fill-opacity: .08; }
.pick-mode, .pick-mode .leaflet-interactive { cursor: crosshair !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-content-wrapper { border-radius: var(--r); }
.leaflet-popup-content { margin: 12px 14px; min-width: 240px; font-size: 14px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink-2); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar a:hover { background: var(--surface-2); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--ink-2); font-size: 11px; }
.leaflet-control-attribution a { color: var(--accent); }
.coords { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  font-family: var(--f-mono); font-size: 12px; line-height: 1.35; color: var(--ink); pointer-events: none; }
.coords b { font-family: var(--f-body); font-weight: 600; }

/* Marcadores: círculo = meteorológica, cuadrado = pluviométrica, rombo = hidrológica */
.stn-icon { background: none; border: 0; }
.stn { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border: 2.5px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.45); background: var(--off); }
.stn.circ { border-radius: 50%; }
.stn.sq { border-radius: 3px; }
.stn.dia { border-radius: 3px; transform: rotate(45deg) scale(.9); }
.stn.s-linea { background: var(--ok); } .stn.s-retraso { background: var(--warn); } .stn.s-alerta { background: var(--bad); }
.stn.s-mant { background: var(--maint); } .stn.s-desc, .stn.s-sin { background: var(--off); }
.stn-icon.sel .stn { box-shadow: 0 0 0 3px var(--accent), 0 1px 4px rgba(0,0,0,.45); }
.ripple { position: absolute; left: -9px; top: -9px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rain); opacity: 0; animation: ripple 2.4s ease-out infinite; }
.ripple.r2 { animation-delay: 1.2s; }
@keyframes ripple { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
.preview-pin { width: 18px; height: 18px; border-radius: 50%; border: 3px dashed var(--accent); background: var(--accent-soft); }

/* ---------- Panel ---------- */
#panel { position: absolute; z-index: 1000; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 420px; max-width: calc(100% - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.p-head h2 { font-size: 24px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.p-body { overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; overscroll-behavior: contain; }
.grab { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--off); }
.dot.s-linea { background: var(--ok); } .dot.s-retraso { background: var(--warn); } .dot.s-alerta { background: var(--bad); }
.dot.s-mant { background: var(--maint); }
.slist { display: grid; gap: 2px; margin: 0 -6px; }
.sitem { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 6px; border: 0; background: none; border-radius: 8px; cursor: pointer; }
.sitem:hover { background: var(--surface-2); }
.sitem .ico { position: relative; width: 22px; height: 22px; }
.sitem .ico .stn { left: 3px; top: 3px; }
.sitem b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.sitem .meta { font-size: 12px; color: var(--ink-2); }
.sitem .age { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); text-align: right; }
.empty { display: grid; gap: 12px; padding: 8px 0; }
.empty h3 { font-size: 20px; }
.empty p { margin: 0; color: var(--ink-2); }

.st-code { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; background: var(--surface-2); }
.chip.state { font-weight: 600; }
.chip.state.s-linea { color: var(--ok); border-color: currentColor; } .chip.state.s-retraso { color: var(--warn); border-color: currentColor; }
.chip.state.s-alerta { color: var(--bad); border-color: currentColor; } .chip.state.s-mant { color: var(--maint); border-color: currentColor; }
.chip.state.s-desc, .chip.state.s-sin { color: var(--off); border-color: currentColor; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 2px; background: var(--surface-2); text-align: left; cursor: pointer; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-2); }
.tile .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .v small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile .t { font-size: 11.5px; color: var(--ink-2); }
.tile.flag .v { color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chartbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 6px; background: var(--surface-2); }
.chartbox .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); padding: 0 4px 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-2); font-family: var(--f-mono); font-size: 10px; }
.chart .bar { fill: var(--rain); }
.chart .area { fill: var(--rain-soft); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; }
.chart .cum { fill: none; stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
.chart .flag { fill: var(--warn); }
.chart .hover { stroke: var(--ink-2); stroke-width: 1; }
.chart .hdot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .tip { fill: var(--ink); font-family: var(--f-mono); font-size: 11px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.section-title h3 { font-size: 18px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
.list-plain { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list-plain li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13.5px; background: var(--surface-2); }
.varrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; }
.varrow .code { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { background: var(--surface-2); font-weight: 600; }
table.data td.num { font-family: var(--f-mono); text-align: right; }
table.data td.q { color: var(--warn); font-weight: 600; }
table.data select { min-height: 30px; padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 20px 14px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13.5px; }
.popup h4 { margin: 0 0 2px; font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.popup table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.popup td { padding: 3px 0; border-bottom: 1px solid var(--line); }
.popup td.v { text-align: right; font-family: var(--f-mono); padding-left: 10px; }
.popup td.c { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); padding-right: 8px; }
.popup .actions { margin-top: 6px; }

/* ---------- Avisos y diálogo ---------- */
#toasts { position: fixed; z-index: 3000; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(92vw, 420px); }
.toast { background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; }
.toast.bad { background: var(--bad); color: #fff; }
#modal { position: fixed; inset: 0; z-index: 4000; background: rgba(8, 20, 26, .45); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 14px; padding: 18px; width: min(100%, 380px); display: grid; gap: 14px; box-shadow: var(--shadow); }
.dialog h3 { font-size: 22px; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog .actions { justify-content: flex-end; }
.banner { position: absolute; z-index: 999; left: 12px; top: 12px; max-width: min(360px, calc(100% - 24px)); }

/* ---------- Móvil: el panel se vuelve una hoja inferior ---------- */
@media (max-width: 760px) {
  #login { grid-template-columns: 1fr; }
  .login-art { min-height: 220px; max-height: 300px; }
  .login-art .cap { display: none; }
  .brand b { font-size: 38px; }
  .topbar .basemaps { display: none; }
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; max-height: 62%; border-radius: 16px 16px 0 0;
    border-left: 0; border-right: 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #panel.min { max-height: 64px; }
  #panel.min .p-body { display: none; }
  .p-head { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); position: relative; padding-top: 18px; }
  .p-body { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .grab { display: block; position: absolute; left: 50%; top: 6px; width: 44px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); border: 0; padding: 0; cursor: pointer; }
  .grab::after { content: ""; position: absolute; inset: -10px -20px; }
  .mbasemap { display: inline-flex !important; }
  .leaflet-bottom { bottom: 64px; }
  .row3 { grid-template-columns: 1fr 1fr; }
}
.mbasemap { display: none !important; }
@media (prefers-reduced-motion: reduce) { .ripple { animation: none; opacity: .5; transform: scale(.8); } * { scroll-behavior: auto !important; } }

/* ================= v1.1 ================= */
/* Indicadores de la red */
.kpis { display: flex; gap: 2px; margin-left: 14px; min-width: 0; }
.kpi { display: grid; grid-template-columns: auto; align-content: center; padding: 2px 14px; border-left: 1px solid var(--line); min-width: 0; }
.kpi .kl { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.kpi .kval { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .kval small { font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--ink-2); }
.kpi .ks { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.kpi.wide { grid-template-columns: auto auto; column-gap: 8px; }
.kpi.wide .kl { grid-column: 1 / -1; }
.kpi.wide .ks { align-self: end; padding-bottom: 2px; }
.kpi.hot .kval { color: var(--bad); }
.kpi-inline { display: none; }
@media (max-width: 1180px) {
  .kpis { display: none; }
  .kpi-inline:not(:empty) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi-inline .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface-2); }
  .kpi-inline .kpi .ks { max-width: none; }
}
/* Barra de carga del mapa base */
.pbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--accent-soft); }
.pbar > i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: pbar 1.1s ease-in-out infinite; }
@keyframes pbar { 0% { left: -30%; } 100% { left: 100%; } }

/* Filtros de la lista */
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fchips button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.fchips .mini { width: 9px; height: 9px; background: var(--ink-2); display: inline-block; }
.fchips .mini.circ { border-radius: 50%; } .fchips .mini.sq { border-radius: 2px; } .fchips .mini.dia { transform: rotate(45deg) scale(.85); border-radius: 1px; }
.legend button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: none; padding: 2px 6px; margin: -2px -6px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.legend button:hover { border-color: var(--line); }
.legend button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.sitem .age { display: grid; justify-items: end; gap: 1px; }
.sitem .r24 { font-family: var(--f-mono); font-size: 11.5px; color: var(--rain); }

/* Panel del mapa: capas y leyenda */
.maplegend { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: 214px; max-width: calc(100vw - 80px); font-size: 12.5px; color: var(--ink); overflow: hidden; }
.mlg-head { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; font-weight: 600; font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
.mlg-head::after { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2); transform: rotate(45deg); margin-top: -4px; transition: transform .15s; }
.mlg-head[aria-expanded="true"]::after { transform: rotate(-135deg); margin-top: 3px; }
.mlg-body { padding: 0 10px 10px; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; max-height: 60vh; overflow-y: auto; }
.mlg-toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; }
.mlg-toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.mlg-sec { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.mlg-rows { display: grid; gap: 4px; }
.mlg-rows > span { display: flex; align-items: center; gap: 8px; }
.mlg-ico { position: relative; width: 16px; height: 16px; display: inline-block; flex: none; }
.mlg-ico .stn { left: 1px; top: 1px; width: 12px; height: 12px; border-width: 2px; box-shadow: none; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
.iso-scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; margin-top: 2px; }
.iso-scale span { display: grid; gap: 2px; font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); text-align: left; white-space: nowrap; }
.iso-scale i { height: 10px; display: block; border-radius: 1px; }
.iso-note { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.iso-note b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.iso-img { image-rendering: auto; }
.coords .iso-v { color: var(--rain); font-weight: 500; }
.leaflet-control-scale-line { background: color-mix(in srgb, var(--surface) 85%, transparent); border-color: var(--ink-2); color: var(--ink); font-family: var(--f-mono); font-size: 11px; }

/* Detalle: minigráficas, comparación, rosa, tabla */
.tile .spark { width: 100%; height: 22px; margin-top: 4px; display: block; overflow: visible; }
.tile .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.tile .spark rect { fill: var(--rain); }
.tile .spark line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.tile.flag .spark polyline { stroke: var(--warn); }
.chart .ln2 { fill: none; stroke: var(--cmp); stroke-width: 1.8; stroke-linejoin: round; stroke-dasharray: 5 3; }
.chart .hdot2 { fill: var(--cmp); stroke: var(--surface); stroke-width: 2; }
.cmp-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 4px 6px; font-size: 12.5px; }
.cmp-legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.cmp-legend .sw { width: 16px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
.cmp-legend .sw.b { border-top: 2px dashed var(--cmp); }
.chart-foot { display: flex; justify-content: flex-end; padding: 6px 4px 2px; }
.rose { display: grid; grid-template-columns: minmax(140px, 180px) minmax(0, 1fr); gap: 14px; align-items: center; }
.rose .kv { grid-template-columns: 1fr; gap: 0; }
.rose .kv dt { font-size: 12px; }
.rose .kv dd { margin-bottom: 7px; }
.rose svg { width: 100%; height: auto; }
.rose .rg { fill: none; stroke: var(--line); }
.rose .rl { fill: var(--ink-2); font-family: var(--f-mono); font-size: 9px; }
.rose .cl { fill: var(--ink); font-family: var(--f-display); font-size: 13px; font-weight: 600; }
.rose .pet { fill: var(--accent); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.rose .pet.top { fill-opacity: .85; }
details.tbl summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
details.tbl .tablewrap { margin-top: 8px; }
details.tbl th .muted { font-weight: 400; font-size: 11px; }
dl.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; align-items: center; }
dl.keys dt { text-align: right; } dl.keys dd { margin: 0; }
dl.keys kbd { font-size: 13px; padding: 1px 7px; color: var(--ink); }
.menu kbd { margin-left: 6px; }
@media (max-width: 760px) {
  .rose { grid-template-columns: 1fr; justify-items: center; }
  .rose svg { max-width: 220px; }
  .maplegend { width: 196px; }
}
@media (prefers-reduced-motion: reduce) { .pbar > i { animation: none; left: 0; width: 100%; opacity: .5; } }

/* ================= v1.2 · Ingreso ================= */
#login { position: relative; }
.login-side { background: var(--surface); border-left: 1px solid var(--line); }
.login-box { gap: 16px; }
.login-box > * { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.login-box > :nth-child(2) { animation-delay: .06s; } .login-box > :nth-child(3) { animation-delay: .12s; }
.login-box > :nth-child(4) { animation-delay: .18s; } .login-box > :nth-child(5) { animation-delay: .24s; }
.login-box > :nth-child(6) { animation-delay: .30s; } .login-box > :nth-child(7) { animation-delay: .36s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.login-box.shake { animation: shake .36s ease; }
.login-box.shake > * { animation: none; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* Pestañas con indicador deslizante */
.auth-tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.auth-tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 8px 0; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; border-radius: 8px; transition: color .2s; }
.auth-tabs button[aria-selected="true"] { color: var(--ink); }
.auth-ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 8px; background: var(--surface); box-shadow: 0 1px 3px rgba(16, 46, 56, .14); transition: transform .28s cubic-bezier(.3, .7, .2, 1); }
.auth-tabs[data-mode="up"] .auth-ind { transform: translateX(100%); }

/* Campos que aparecen al crear cuenta */
.reveal:not([hidden]) { animation: reveal .28s ease both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.field > label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.pw { position: relative; }
.pw input { width: 100%; min-height: 40px; padding: 8px 44px 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.pw input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 32px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--ink-2); display: grid; place-items: center; }
.pw-eye:hover { color: var(--ink); background: var(--surface); }
.pw-eye svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.pw-eye .slash { transition: opacity .15s; }
.pw-eye[aria-pressed="true"] .slash { opacity: 0; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.meter i { height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.meter i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: var(--bad); transition: width .3s ease, background-color .3s; }
.meter[data-score="1"] i::after { width: 30%; background: var(--warn); }
.meter[data-score="2"] i::after { width: 55%; background: var(--warn); }
.meter[data-score="3"] i::after { width: 80%; background: var(--ok); }
.meter[data-score="4"] i::after { width: 100%; background: var(--ok); }

/* Botones del ingreso */
.btn.big { min-height: 44px; font-size: 15px; position: relative; }
.btn .spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
.btn.busy .spin { display: inline-block; }
.btn.busy { opacity: .85; cursor: progress; }
@keyframes spin { to { transform: rotate(360deg); } }
.or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--ink-2); font-size: 12px; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); }
.btn.demo { display: grid; justify-items: center; gap: 1px; min-height: 54px; padding: 8px 14px; border-color: var(--accent); color: var(--accent); background: var(--surface); transition: background-color .2s, transform .15s; }
.btn.demo b { font-size: 15px; }
.btn.demo small { font-weight: 500; font-size: 12px; color: var(--ink-2); }
.btn.demo:hover { background: var(--accent-soft); }
.btn.demo:active, .btn.primary:active { transform: scale(.985); }
.btn.demo.busy { opacity: .7; }

/* Mapa animado */
.login-art .dep { fill-opacity: 0; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease var(--d, 0s) forwards, fillin .7s ease calc(var(--d, 0s) + .6s) forwards; }
.login-art .iso { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease var(--d, 1.5s) forwards; }
.login-art .ldot { fill: var(--accent); stroke: var(--surface); stroke-width: .06; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) var(--d, 1s) forwards; }
.login-art .lrip { fill: none; stroke: var(--rain); stroke-width: .05; transform-box: fill-box; transform-origin: center; animation: drop 1.8s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fillin { to { fill-opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@keyframes drop { from { opacity: .9; transform: scale(.15); } to { opacity: 0; transform: scale(1); } }
.art-feats { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 42px; display: grid; gap: 2px; }
.art-k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.art-line { font-family: var(--f-display); font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1.15; transition: opacity .3s, transform .3s; max-width: 30ch; }
.art-line.out { opacity: 0; transform: translateY(6px); }

/* Transiciones entre pantallas */
#login.leaving .login-box { transition: opacity .35s, transform .35s; opacity: 0; transform: translateY(-8px) scale(.98); }
#login.leaving .login-art svg { transition: transform .38s ease-in, opacity .38s; transform: scale(1.08); opacity: .4; }
#app.entering { animation: appIn .45s ease both; }
#app.entering #panel { animation: panelIn .5s cubic-bezier(.2, .7, .2, 1) .08s both; }
#app.leaving { transition: opacity .25s; opacity: 0; }
@keyframes appIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes panelIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .art-feats { bottom: 14px; }
  .art-line { font-size: 19px; }
  .login-side { border-left: 0; border-top: 1px solid var(--line); }
  @keyframes panelIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  .login-box > *, .reveal:not([hidden]), #app.entering, #app.entering #panel { animation: none !important; }
  .login-art .dep, .login-art .iso, .login-art .ldot { animation: none !important; stroke-dashoffset: 0; fill-opacity: 1; opacity: 1; }
  .auth-ind, .meter i::after, .art-line { transition: none; }
}
.art-feats { padding: 28px 0 0; background: linear-gradient(to bottom, transparent, var(--sea) 45%); margin-left: -16px; padding-left: 16px; }
@media (max-width: 760px) {
  .login-box { display: flex; flex-direction: column; }
  .login-box > .brand, .login-box > #loginLead { order: 0; }
  .login-box > .btn.demo { order: 1; }
  .login-box > .or { order: 2; }
  .login-box > .auth-tabs { order: 3; }
  .login-box > form { order: 4; }
  .login-box > #loginHint { order: 5; }
}

/* ================= Base de datos (IndexedDB, con respaldo en memoria) ================= */
const DB = (() => {
  let db = null; let mem = null;
  const STORES = { users: 'username', stations: 'id', readings: 'k', imports: 'id', log: 'id' };
  function open() {
    return new Promise((res) => {
      let req;
      try { req = indexedDB.open('isoyeta', 1); } catch { return res(false); }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const [name, key] of Object.entries(STORES)) {
          if (d.objectStoreNames.contains(name)) continue;
          const os = d.createObjectStore(name, { keyPath: key });
          if (name === 'readings' || name === 'imports') os.createIndex('st', 'stationId');
        }
      };
      req.onsuccess = () => { db = req.result; res(true); };
      req.onerror = () => res(false);
      req.onblocked = () => res(false);
    });
  }
  function memStore(name) { mem[name] = mem[name] || new Map(); return mem[name]; }
  function run(name, mode, fn) {
    return new Promise((res, rej) => {
      const tx = db.transaction(name, mode); const os = tx.objectStore(name);
      let out; const r = fn(os);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  return {
    get persistent() { return !!db; },
    async init() { const ok = await open(); if (!ok) mem = {}; return ok; },
    all(name) { return db ? run(name, 'readonly', (os) => os.getAll()) : Promise.resolve([...memStore(name).values()]); },
    get(name, key) { return db ? run(name, 'readonly', (os) => os.get(key)) : Promise.resolve(memStore(name).get(key)); },
    put(name, val) { if (!db) { memStore(name).set(val[STORES[name]], val); return Promise.resolve(); } return run(name, 'readwrite', (os) => { os.put(val); }); },
    del(name, key) { if (!db) { memStore(name).delete(key); return Promise.resolve(); } return run(name, 'readwrite', (os) => { os.delete(key); }); },
    putMany(name, vals) {
      if (!db) { const m = memStore(name); vals.forEach((v) => m.set(v[STORES[name]], v)); return Promise.resolve(); }
      return run(name, 'readwrite', (os) => { for (const v of vals) os.put(v); });
    },
    byStation(name, id) {
      if (!db) return Promise.resolve([...memStore(name).values()].filter((r) => r.stationId === id));
      return run(name, 'readonly', (os) => os.index('st').getAll(IDBKeyRange.only(id)));
    },
    async delByStation(name, id) {
      if (!db) { const m = memStore(name); for (const [k, v] of m) if (v.stationId === id) m.delete(k); return; }
      return run(name, 'readwrite', (os) => {
        const c = os.index('st').openKeyCursor(IDBKeyRange.only(id));
        c.onsuccess = () => { const cur = c.result; if (cur) { os.delete(cur.primaryKey); cur.continue(); } };
      });
    },
  };
})();

/* ================= Autenticación (PBKDF2-SHA-256, sal por usuario) ================= */
const AUTH = {
  iter: 150000,
  fails: 0, lockUntil: 0,
  b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); },
  async hash(pw, saltB64, iter) {
    const salt = Uint8Array.from(atob(saltB64), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
    return this.b64(bits);
  },
  ready() { return !!(window.crypto && crypto.subtle); },
  async create(username, name, pw) {
    const salt = this.b64(crypto.getRandomValues(new Uint8Array(16)));
    const hash = await this.hash(pw, salt, this.iter);
    await DB.put('users', { username, name, salt, hash, iter: this.iter, createdAt: Date.now() });
  },
  async check(username, pw) {
    if (Date.now() < this.lockUntil) return { ok: false, msg: `Demasiados intentos. Espera ${Math.ceil((this.lockUntil - Date.now()) / 1000)} s.` };
    const u0 = await DB.get('users', username);
    const u = u0?.guest ? null : u0; // cuentas de invitado de versiones anteriores ya no ingresan
    const h = u ? await this.hash(pw, u.salt, u.iter) : await this.hash(pw, 'AAAAAAAAAAAAAAAAAAAAAA==', this.iter);

      this.fails++;
      if (this.fails >= 5) { this.lockUntil = Date.now() + 30000; this.fails = 0; }
      return { ok: false, msg: 'Usuario o contraseña incorrectos. Si no tienes cuenta, créala en la pestaña «Crear cuenta».' };
    }
    this.fails = 0; return { ok: true, user: u };
  },
};

/* ================= Geografía: departamento por coordenada (sin internet) ================= */
const GEOIDX = (() => {
  const feats = (GEO?.departamentos?.features || []).map((f) => {
    let minX = 180, minY = 90, maxX = -180, maxY = -90;
    for (const poly of f.geometry.coordinates) for (const [x, y] of poly[0]) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    return { name: f.properties.n, code: f.properties.c, polys: f.geometry.coordinates, bbox: [minX, minY, maxX, maxY] };
  });
  function inRing(x, y, r) {
    let inside = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function inside(lat, lon) {
    for (const f of feats) {
      const [a, b, c, d] = f.bbox;
      if (lon < a || lon > c || lat < b || lat > d) continue;
      for (const poly of f.polys) if (inRing(lon, lat, poly[0]) && !poly.slice(1).some((h) => inRing(lon, lat, h))) return f.name;
    }
    return null;
  }
  /* Si el punto cae justo afuera del límite simplificado, toma el departamento más cercano a menos de ~10 km */
  function nearest(lat, lon, tol = 0.09) {
    let best = null, bd = tol * tol;
    for (const f of feats) {
      const [a, b, c, d] = f.bbox;
      if (lon < a - tol || lon > c + tol || lat < b - tol || lat > d + tol) continue;
      for (const poly of f.polys) {
        const r = poly[0];
        for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
          const [x1, y1] = r[j], [x2, y2] = r[i], dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
          const t = L2 ? Math.max(0, Math.min(1, ((lon - x1) * dx + (lat - y1) * dy) / L2)) : 0;
          const ex = x1 + t * dx - lon, ey = y1 + t * dy - lat, d2 = ex * ex + ey * ey;
          if (d2 < bd) { bd = d2; best = f.name; }

  }

})();
function dms(v, pos, neg) {
  const s = v >= 0 ? pos : neg; v = Math.abs(v);
  const d = Math.floor(v), m = Math.floor((v - d) * 60), sec = ((v - d) * 60 - m) * 60;
  return `${d}°${pad(m)}′${sec.toFixed(1).padStart(4, '0')}″${s}`;
}
/* Acepta 4.6097, "4,6097", "4°36'35\"N" o "74°4'54.1\"W/O" */
function parseCoord(str, isLon) {
  str = String(str || '').trim(); if (!str) return NaN;
  const m = str.match(/^(-?\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['′])?\s*(?:(\d+(?:[.,]\d+)?)\s*(?:["″]|''))?\s*([NSEOW])?$/i);
  if (m) {
    let v = Math.abs(parseFloat(m[1].replace(',', '.'))) + (m[2] ? parseFloat(m[2].replace(',', '.')) / 60 : 0) + (m[3] ? parseFloat(m[3].replace(',', '.')) / 3600 : 0);
    const h = (m[4] || '').toUpperCase();
    if (m[1].startsWith('-') || h === 'S' || h === 'W' || h === 'O') v = -v;

}

/* Diálogo modal: el foco queda atrapado dentro, Esc cancela y al cerrar vuelve a donde estaba */
function modal(html, setup) {
  return new Promise((res) => {
    const m = $('#modal'), prev = document.activeElement;
    m.innerHTML = html; m.hidden = false;
    const dlg = m.firstElementChild;
    const focusables = () => $$('button, select, input, textarea, a[href], [tabindex]:not([tabindex="-1"])', dlg).filter((x) => !x.disabled && x.offsetParent !== null);
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(null); return; }
      if (e.key !== 'Tab') return;
      const f = focusables(); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    };
    function done(v) {
      document.removeEventListener('keydown', key, true);
      m.hidden = true; m.innerHTML = ''; m.onclick = null;
      if (prev && typeof prev.focus === 'function' && document.contains(prev)) prev.focus();
      res(v);
    }
    document.addEventListener('keydown', key, true);
    m.onclick = (e) => { if (e.target === m) done(null); };
    setup(dlg, done);
  });
}

const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (pw.length < 8) return loginError('La contraseña debe tener al menos 8 caracteres.', $('#fPass'));
        if (pw !== $('#fPass2').value) return loginError('Las contraseñas no coinciden.', $('#fPass2'));
        if (await DB.get('users', username)) return loginError('Ese usuario ya existe. Elige otro o ingresa con él en la pestaña «Ingresar».', $('#fUser'));
        const name = $('#fNombre').value.trim();
        await AUTH.create(username, name, pw);
        S.user = { username, name }; await log('Creó una cuenta', username);
      } else {
        const r = await AUTH.check(username, pw);
        if (!r.ok) { loginError(r.msg); $('#fPass').select(); return; }
        S.user = { username: r.user.username, name: r.user.name };
      }
      session.set(username); await log('Inició sesión');
      await enterApp();
    } catch (x) { loginError('No se pudo completar: ' + x.message); }
    finally { setBusy(btn, false); }
  };
}

function setBase(key, quiet = false) {

  if (key === 'vector') { el.classList.remove('tiles-on'); return; }

/* ================= ISOYETAS: lluvia 24 h interpolada entre estaciones =================
   Interpolación por distancia inversa (IDW, potencia 2) sobre una malla regular en
   coordenadas Mercator, recortada a Colombia y limitada a un radio de influencia
   alrededor de cada estación. Las curvas se trazan con marching squares en los
   límites de cada clase de lluvia. */
const ISO = (() => {
  const BINS = [0, 1, 5, 10, 20, 35, 50];
  // Paletas por tema: en oscuro las clases bajas son azules profundos para no velar el mapa
  const PAL = {
    light: { rgb: [[214, 234, 240], [168, 211, 231], [117, 178, 220], [67, 138, 203], [38, 94, 178], [50, 58, 148], [92, 40, 128]],
      alpha: [0.32, 0.55, 0.66, 0.72, 0.78, 0.82, 0.86], line: 'rgba(16, 38, 70, .62)', dep: 'rgba(20, 44, 56, .30)' },
    dark: { rgb: [[30, 66, 92], [33, 92, 132], [42, 120, 175], [58, 146, 212], [96, 170, 236], [150, 150, 240], [200, 128, 236]],
      alpha: [0.40, 0.55, 0.64, 0.72, 0.78, 0.82, 0.86], line: 'rgba(225, 240, 250, .55)', dep: 'rgba(200, 225, 235, .22)' },
  };
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark'
    || (document.documentElement.getAttribute('data-theme') !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  let RGB = PAL.light.rgb, ALPHA = PAL.light.alpha, LINE = PAL.light.line, DEP = PAL.light.dep;
  const usePalette = () => { const q = PAL[isDark() ? 'dark' : 'light']; RGB = q.rgb; ALPHA = q.alpha; LINE = q.line; DEP = q.dep; };
  const R_FULL = 110, R_MAX = 170; // km
  const BOX = { lonMin: -79.2, lonMax: -66.8, latMin: -4.4, latMax: 12.7 };
  const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  const imerc = (y) => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
  const binOf = (v) => { let i = 0; while (i < BINS.length - 1 && v >= BINS[i + 1]) i++; return i; };
  const st = { on: false, layer: null, grid: null, info: null, timer: 0 };
  const label = (i) => i === BINS.length - 1 ? `${BINS[i]}+` : `${BINS[i]}`;

  function sources() {
    return S.stations.filter((s) => s.latest?.PREC && Number.isFinite(s.rain24) && ['linea', 'retraso', 'alerta'].includes(estado(s))
      && s.lat >= BOX.latMin && s.lat <= BOX.latMax && s.lon >= BOX.lonMin && s.lon <= BOX.lonMax);
  }
  function compute(src) {
    const cols = 300, yMin = merc(BOX.latMin), yMax = merc(BOX.latMax);
    const rows = Math.round(cols * (yMax - yMin) / ((BOX.lonMax - BOX.lonMin) * Math.PI / 180));
    const val = new Float32Array(cols * rows), msk = new Float32Array(cols * rows);
    const dLon = (BOX.lonMax - BOX.lonMin) / cols;
    for (let r = 0; r < rows; r++) {
      const lat = imerc(yMax - (r + 0.5) * (yMax - yMin) / rows), kx = 111.32 * Math.cos(lat * Math.PI / 180);
      for (let c = 0; c < cols; c++) {
        const lon = BOX.lonMin + (c + 0.5) * dLon;
        let num = 0, den = 0, dmin = Infinity, exact = null;
        for (const s of src) {
          const dx = (lon - s.lon) * kx, dy = (lat - s.lat) * 110.57, d2 = dx * dx + dy * dy;
          if (d2 < 1) exact = s.rain24;
          if (d2 < dmin) dmin = d2;
          const w = 1 / d2; num += w * s.rain24; den += w;
        }
        const d = Math.sqrt(dmin), i = r * cols + c;
        val[i] = exact ?? num / den;
        msk[i] = d <= R_FULL ? 1 : d >= R_MAX ? 0 : 1 - (d - R_FULL) / (R_MAX - R_FULL);
      }
    }
    return { cols, rows, yMin, yMax, val, msk };
  }
  /* Segmentos de las curvas de nivel (marching squares, en coordenadas de malla) */
  function contours(g, level) {
    const { cols, rows, val, msk } = g, seg = [];
    const V = (r, c) => val[r * cols + c];
    for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
      if (msk[r * cols + c] < 0.05 || msk[r * cols + c + 1] < 0.05 || msk[(r + 1) * cols + c] < 0.05 || msk[(r + 1) * cols + c + 1] < 0.05) continue;
      const tl = V(r, c), tr = V(r, c + 1), br = V(r + 1, c + 1), bl = V(r + 1, c);
      const idx = (tl >= level) * 8 + (tr >= level) * 4 + (br >= level) * 2 + (bl >= level);
      if (idx === 0 || idx === 15) continue;
      const t = (a, b) => (level - a) / (b - a);
      const e = [[c + t(tl, tr), r], [c + 1, r + t(tr, br)], [c + t(bl, br), r + 1], [c, r + t(tl, bl)]];
      const P = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 5: [[0, 1], [3, 2]], 6: [[0, 2]], 7: [[0, 3]], 8: [[3, 0]],
        9: [[0, 2]], 10: [[3, 0], [2, 1]], 11: [[0, 1]], 12: [[3, 1]], 13: [[1, 2]], 14: [[3, 2]] }[idx];
      for (const [a, b] of P) seg.push([e[a], e[b]]);
    }
    return seg;
  }
  function paint(g) {
    const SC = 3, W = g.cols * SC, H = g.rows * SC;
    // 1) campo a resolución final: valor y máscara interpolados (bilineal) y color por clase
    const field = document.createElement('canvas'); field.width = W; field.height = H;
    const f = field.getContext('2d'), img = f.createImageData(W, H), D = img.data;
    const { cols, rows, val, msk } = g;
    for (let y = 0; y < H; y++) {
      const gy = Math.min(rows - 1.001, Math.max(0, (y + 0.5) / SC - 0.5)), r0 = Math.floor(gy), fy = gy - r0;
      for (let x = 0; x < W; x++) {
        const gx = Math.min(cols - 1.001, Math.max(0, (x + 0.5) / SC - 0.5)), c0 = Math.floor(gx), fx = gx - c0;
        const i00 = r0 * cols + c0, i01 = i00 + 1, i10 = i00 + cols, i11 = i10 + 1;
        const a = (msk[i00] * (1 - fx) + msk[i01] * fx) * (1 - fy) + (msk[i10] * (1 - fx) + msk[i11] * fx) * fy;
        if (a <= 0.01) continue;
        const v = (val[i00] * (1 - fx) + val[i01] * fx) * (1 - fy) + (val[i10] * (1 - fx) + val[i11] * fx) * fy;
        const b = binOf(v), k = (y * W + x) * 4;
        D[k] = RGB[b][0]; D[k + 1] = RGB[b][1]; D[k + 2] = RGB[b][2]; D[k + 3] = Math.round(255 * ALPHA[b] * Math.min(1, a));
      }
    }
    f.putImageData(img, 0, 0);
    // 2) curvas en los límites de clase
    f.lineJoin = 'round'; f.lineCap = 'round';
    for (const lv of BINS.slice(1)) {
      f.strokeStyle = LINE; f.lineWidth = lv >= 10 ? 1.6 : 1.1;
      f.beginPath();
      for (const [[x1, y1], [x2, y2]] of contours(g, lv)) { f.moveTo((x1 + 0.5) * SC, (y1 + 0.5) * SC); f.lineTo((x2 + 0.5) * SC, (y2 + 0.5) * SC); }
      f.stroke();
    }
    // 3) recorte a Colombia: máscara con cada departamento y composición "source-in"
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const o = out.getContext('2d');
    const P = (lon, lat) => [(lon - BOX.lonMin) / (BOX.lonMax - BOX.lonMin) * W, (g.yMax - merc(lat)) / (g.yMax - g.yMin) * H];
    const ring = (rg) => { o.beginPath(); rg.forEach(([x, y], k) => { const [a, b] = P(x, y); k ? o.lineTo(a, b) : o.moveTo(a, b); }); o.closePath(); };
    o.fillStyle = '#000';
    for (const ft of GEO.departamentos.features) for (const poly of ft.geometry.coordinates) { ring(poly[0]); o.fill(); }
    o.globalCompositeOperation = 'source-in'; o.drawImage(field, 0, 0);
    o.globalCompositeOperation = 'source-over'; o.strokeStyle = DEP; o.lineWidth = 1;
    for (const ft of GEO.departamentos.features) for (const poly of ft.geometry.coordinates) { ring(poly[0]); o.stroke(); }
    return out.toDataURL('image/png');
  }
  function legendHtml() {
    if (!st.info) return '';
    const { n, max } = st.info;
    return `<div class="iso-scale">${BINS.map((b, i) => `<span><i style="background:rgba(${RGB[i].join(',')},${Math.max(ALPHA[i], .55)})"></i>${label(i)}</span>`).join('')}</div>
      <div class="iso-note">Lluvia en mm (24 h) · IDW entre ${n} estaciones activas · radio ${R_MAX} km${max ? `<br>Máximo: <b>${fmtNum(max.rain24, 1)} mm</b> en ${esc(max.name)}` : ''}</div>`;
  }
  async function draw() {
    if (S.isoLayer) { S.map.removeLayer(S.isoLayer); S.isoLayer = null; }
    st.grid = null; st.info = null;
    const src = sources();
    if (src.length < 3) {
      updateLegend();
      return { ok: false, n: src.length };
    }
    const g = compute(src);
    usePalette();
    const url = paint(g);
    S.isoLayer = L.imageOverlay(url, [[BOX.latMin, BOX.lonMin], [BOX.latMax, BOX.lonMax]], { pane: 'iso', interactive: false, className: 'iso-img' }).addTo(S.map);
    st.grid = g;
    st.info = { n: src.length, max: src.reduce((a, s) => (!a || s.rain24 > a.rain24 ? s : a), null) };
    updateLegend();
    return { ok: true, n: src.length };
  }
  function updateLegend() {
    const box = $('#isoLegend'); if (!box) return;
    box.hidden = !st.on;
    if (!st.on) return;
    box.innerHTML = st.info ? legendHtml() : `<div class="iso-note">Se necesitan al menos 3 estaciones activas con precipitación para interpolar (hay ${sources().length}).</div>`;
  }
  return {
    label,
    get on() { return st.on; },
    async set(on, quiet = false) {
      st.on = on; store.set('iso', on ? '1' : '0');
      const chk = $('#isoChk'); if (chk) chk.checked = on;
      if (!on) { if (S.isoLayer) { S.map.removeLayer(S.isoLayer); S.isoLayer = null; } st.grid = null; st.info = null; updateLegend(); if (!quiet) toast('Isoyetas ocultas.'); return; }
      const r = await draw();
      if (!quiet) toast(r.ok ? `Isoyetas de lluvia 24 h calculadas con ${r.n} estaciones.` : `Para las isoyetas se necesitan 3 estaciones con precipitación (hay ${r.n}).`, !r.ok);
    },
    refresh() { if (!st.on) return; clearTimeout(st.timer); st.timer = setTimeout(draw, 150); },
    /* Valor interpolado bajo el cursor (o null fuera del área) */
    valueAt(lat, lon) {
      const g = st.grid; if (!g) return null;
      const c = Math.floor((lon - BOX.lonMin) / (BOX.lonMax - BOX.lonMin) * g.cols), r = Math.floor((g.yMax - merc(lat)) / (g.yMax - g.yMin) * g.rows);
      if (c < 0 || r < 0 || c >= g.cols || r >= g.rows) return null;
      const i = r * g.cols + c; if (g.msk[i] < 0.05 || !GEOIDX.at(lat, lon)) return null;
      return g.val[i];
    },
  };
})();

/* ================= ESTACIONES: estado y marcadores ================= */
function lluvia10(st) {
  const p = st.latest?.PREC; if (!p) return 0;
  return st.rain10 ?? 0;
}
function estado(st) {
  if (st.maintenance) return 'mant';
  if (!st.lastT) return 'sin';
  const age = Date.now() - st.lastT, iv = (st.intervalMin || 10) * MIN;
  const alerta = (st.rain10 ?? 0) >= (st.rainAlert ?? 5) || Object.values(st.latest || {}).some((x) => x.q);
  if (age <= 2 * iv + 5 * MIN) return alerta ? 'alerta' : 'linea';
  if (age <= DIA) return alerta ? 'alerta' : 'retraso';
  return 'desc';
}
function pasaFiltro(st) {
  const f = S.filter;
  return (!f.tipo || (st.type || 'met') === f.tipo) && (!f.estado || estado(st) === f.estado);
}
function lloviendo(st) { const e = estado(st); return (e === 'linea' || e === 'alerta') && lluvia10(st) > 0; }
function iconHtml(st) {
  const shape = (TIPOS[st.type] || TIPOS.met).shape;
  const rip = lloviendo(st) ? '<span class="ripple"></span><span class="ripple r2"></span>' : '';
  return `${rip}<span class="stn ${shape} s-${estado(st)}"></span>`;
}
function popupHtml(st) {
  const vars = st.variables || [];
  const rows = vars.map((v) => {
    const l = st.latest?.[v.code];
    return `<tr><td class="c">${esc(v.code)}</td><td>${esc(v.name)}</td><td class="v">${l ? fmtNum(l.v, v.code === 'PREC' ? 2 : 1) + ' ' + esc(v.unit) : '—'}</td></tr>`;
  }).join('');
  return `<div class="popup"><div class="st-code">${esc(st.code)} · ${esc((TIPOS[st.type] || TIPOS.met).label)}</div><h4>${esc(st.name)}</h4>
    <div class="chips"><span class="chip state s-${estado(st)}">${ESTADOS[estado(st)]}</span><span class="chip">${esc(st.dept || '—')}</span></div>
    ${vars.length ? `<table>${rows}</table>${st.latest?.PREC && Number.isFinite(st.rain24) ? `<div class="small"><b>Lluvia 24 h:</b> <span class="mono">${fmtNum(st.rain24, 1)} mm</span></div>` : ''}<div class="small muted">Último dato: ${st.lastT ? fmtFecha(st.lastT) : 'sin datos'}</div>` : '<p class="small muted">Esta estación aún no tiene variables.</p>'}
    <div class="actions"><button class="btn sm primary" data-pop="ver" data-id="${st.id}">Abrir estación</button><button class="btn sm" data-pop="csv" data-id="${st.id}">Cargar datos</button></div></div>`;
}
function renderMarkers() {
  const map = S.map; const seen = new Set();
  for (const st of S.stations) {
    seen.add(st.id);
    const icon = L.divIcon({ className: 'stn-icon' + (S.sel === st.id ? ' sel' : ''), html: iconHtml(st), iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -10] });
    let mk = S.markers.get(st.id);
    if (!mk) {
      mk = L.marker([st.lat, st.lon], { icon, title: st.name, keyboard: true, riseOnHover: true }).addTo(map);
      mk.bindPopup(() => popupHtml(S.stations.find((x) => x.id === st.id)), { maxWidth: 320, autoPanPadding: [20, 80] });
      S.markers.set(st.id, mk);
    } else { mk.setLatLng([st.lat, st.lon]); mk.setIcon(icon); mk.options.title = st.name; }
    mk.setOpacity(pasaFiltro(st) ? 1 : 0.22);
  }
  for (const [id, mk] of S.markers) if (!seen.has(id)) { map.removeLayer(mk); S.markers.delete(id); }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-pop]'); if (!b) return;
  const st = S.stations.find((x) => x.id === b.dataset.id); if (!st) return;
  S.map.closePopup();
  if (b.dataset.pop === 'ver') go('estacion', st.id); else go('importar', st.id);
});
async function loadStations() {
  S.stations = (await DB.all('stations')).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  for (const st of S.stations) if (st.lastT && st.rain24 === undefined) await refreshLatest(st, null);
  renderMarkers(); renderKpis(); ISO.refresh();
}
/* Indicadores de la red, calculados con las estaciones cargadas */
function kpiData() {
  const n = S.stations.length;
  const est = S.stations.map(estado);
  const online = est.filter((e) => e === 'linea' || e === 'alerta').length;
  const alerts = est.filter((e) => e === 'alerta').length;
  const rain = S.stations.filter((s) => s.latest?.PREC && Number.isFinite(s.rain24));
  const max = rain.reduce((a, s) => (!a || s.rain24 > a.rain24 ? s : a), null);
  return { n, online, alerts, max };
}
function renderKpis() {
  const k = kpiData();
  const html = `<div class="kpi"><span class="kl">Estaciones</span><span class="kval">${k.n}</span></div>
    <div class="kpi"><span class="kl">En línea</span><span class="kval">${k.online}<small>/${k.n}</small></span></div>
    <div class="kpi${k.alerts ? ' hot' : ''}"><span class="kl">Alertas</span><span class="kval">${k.alerts}</span></div>
    <div class="kpi wide"><span class="kl">Mayor lluvia 24 h</span><span class="kval">${k.max ? fmtNum(k.max.rain24, 1) + '<small> mm</small>' : '—'}</span>${k.max ? `<span class="ks">${esc(k.max.name)}</span>` : ''}</div>`;
  const top = $('#kpis'); if (top) top.innerHTML = k.n ? html : '';
  const inl = $('#kpisInline'); if (inl) inl.innerHTML = k.n ? html : '';
}
function fitNetwork() {
  if (!S.stations.length) { S.map.flyToBounds([[-4.3, -79.1], [12.6, -66.8]], { duration: .6 }); return; }
  const b = L.latLngBounds(S.stations.map((s) => [s.lat, s.lon]));
  const mobile = matchMedia('(max-width: 760px)').matches;
  S.map.flyToBounds(b.pad(0.15), { duration: .7, maxZoom: 10, paddingTopLeft: [40, 40], paddingBottomRight: mobile ? [20, $('#panel').offsetHeight + 20] : [$('#panel').offsetWidth + 40, 40] });
}
function focusStation(st, zoom = 9) {
  S.sel = st.id; renderMarkers();
  const z = Math.max(S.map.getZoom(), zoom);
  if (matchMedia('(max-width: 760px)').matches) {
    // En el celular el panel tapa la parte de abajo: se deja la estación en la franja visible de arriba
    S.map.setView([st.lat, st.lon], z, { animate: false });
    S.map.panBy([0, Math.round($('#panel').offsetHeight / 2)], { animate: false });
  } else S.map.flyTo([st.lat, st.lon], z, { duration: .6 });
}

/* ================= PANEL: navegación ================= */
const VIEWS = {};
function go(name, arg, replace = false) {
  if (S.pickHandler) stopPick();
  if (replace) S.view.pop();
  S.view.push([name, arg]); render();
}
function back() { if (S.pickHandler) stopPick(); S.view.pop(); if (!S.view.length) S.view.push(['lista']); render(); }
function replaceWith(name, arg) {
  S.view.pop();
  const top = S.view[S.view.length - 1];
  if (top && top[0] === name && top[1] === arg) render(); else go(name, arg);
}
async function render() {
  const [name, arg] = S.view[S.view.length - 1];
  $('#pBody').onclick = null;
  $('#backBtn').hidden = S.view.length < 2; $('#pHeadActions').innerHTML = '';
  $('#panel').classList.remove('min');
  const body = $('#pBody'); body.scrollTop = 0;
  await VIEWS[name](body, arg);
}

async function stationReadings(id) { return (await DB.byStation('readings', id)).sort((a, b) => a.t - b.t); }
function aggregate(points, agg, stepMin = 10) {
  const step = stepMin * MIN, b = new Map();
  for (const p of points) {
    const k = Math.floor(p.t / step) * step;
    let x = b.get(k); if (!x) { x = { t: k, s: 0, n: 0, sx: 0, sy: 0, q: '' }; b.set(k, x); }
    x.s += p.v; x.n++; if (p.q) x.q = p.q;
    if (agg === 'circ') { x.sx += Math.cos(p.v * Math.PI / 180); x.sy += Math.sin(p.v * Math.PI / 180); }
  }
  return [...b.values()].sort((a, c) => a.t - c.t).map((x) => ({
    t: x.t, q: x.q,
    v: agg === 'sum' ? x.s : agg === 'circ' ? ((Math.atan2(x.sy, x.sx) * 180 / Math.PI) + 360) % 360 : x.s / x.n,
  }));
}

/* Minigráfica de las últimas 24 h de datos de una variable */
function sparkline(all, v) {
  let pts = all.filter((r) => r.c === v.code); if (pts.length < 2) return '';
  const end = pts[pts.length - 1].t; pts = pts.filter((p) => p.t > end - DIA);
  const agg = v.agg || presetBy(v.code)?.agg || 'mean';
  pts = aggregate(pts, agg === 'circ' ? 'circ' : agg, agg === 'sum' ? 60 : 20);
  if (pts.length < 2) return '';
  const W = 100, H = 22, t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vs = pts.map((p) => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (agg === 'sum') lo = 0; if (hi === lo) hi = lo + 1;
  const X = (t) => (t - t0) / (t1 - t0) * W, Y = (x) => H - 1 - (x - lo) / (hi - lo) * (H - 2);
  if (agg === 'sum') {
    const bw = Math.max(1, W / pts.length - 0.8);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${pts.filter((p) => p.v > 0).map((p) => `<rect x="${(X(p.t) - bw / 2).toFixed(1)}" y="${Y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - 1 - Y(p.v)).toFixed(1)}"/>`).join('')}<line x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}"/></svg>`;
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map((p) => X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/></svg>`;
}
/* Tabla con las últimas filas: una columna por variable */
function lastRowsTable(st, all) {
  const byT = new Map(); for (const r of all) { if (!byT.has(r.t)) byT.set(r.t, {}); byT.get(r.t)[r.c] = r; }
  const times = [...byT.keys()].sort((a, b) => b - a).slice(0, 12);
  if (!times.length) return '<p class="small muted">Sin registros.</p>';
  return `<div class="tablewrap"><table class="data"><thead><tr><th>Fecha y hora</th>${st.variables.map((v) => `<th title="${esc(v.name)}">${esc(v.code)}<br><span class="muted">${esc(v.unit)}</span></th>`).join('')}</tr></thead><tbody>
    ${times.map((t) => `<tr><td class="mono">${fmtFecha(t)}</td>${st.variables.map((v) => { const r = byT.get(t)[v.code]; return r ? `<td class="num${r.q ? ' q' : ''}">${fmtNum(r.v, v.code === 'PREC' ? 2 : 1)}</td>` : '<td class="num muted">—</td>'; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
/* Rosa de los vientos: frecuencia de la dirección (de dónde viene el viento) en 16 sectores */
const RUMBOS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
function drawRose(el, all) {
  let dir = all.filter((r) => r.c === 'DIRV');
  if (dir.length < 6) { el.innerHTML = ''; return; }
  const end = dir[dir.length - 1].t; dir = dir.filter((r) => r.t > end - DIA);
  const vel = new Map(all.filter((r) => r.c === 'VELV' && r.t > end - DIA).map((r) => [r.t, r.v]));
  const n = new Array(16).fill(0), sv = new Array(16).fill(0), nv = new Array(16).fill(0);
  for (const r of dir) { const k = Math.round(((r.v % 360) + 360) % 360 / 22.5) % 16; n[k]++; if (vel.has(r.t)) { sv[k] += vel.get(r.t); nv[k]++; } }
  const tot = dir.length, mx = Math.max(...n), top = n.indexOf(mx);
  const C = 110, R = 82, rad = (deg) => (deg - 90) * Math.PI / 180;
  let s = '';
  for (const f of [.25, .5, .75, 1]) s += `<circle class="rg" cx="${C}" cy="${C}" r="${(R * f).toFixed(1)}"/>`;
  s += `<text class="rl" x="${C + 3}" y="${(C - R * 1 + 10).toFixed(1)}">${Math.round(mx / tot * 100)} %</text>`;
  n.forEach((c, k) => {
    if (!c) return;
    const r = R * c / mx, a0 = rad(k * 22.5 - 9), a1 = rad(k * 22.5 + 9);
    const meanV = nv[k] ? sv[k] / nv[k] : null;
    s += `<path class="pet${k === top ? ' top' : ''}" d="M${C} ${C}L${(C + r * Math.cos(a0)).toFixed(1)} ${(C + r * Math.sin(a0)).toFixed(1)}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${(C + r * Math.cos(a1)).toFixed(1)} ${(C + r * Math.sin(a1)).toFixed(1)}Z"><title>${RUMBOS[k]}: ${Math.round(c / tot * 100)} %${meanV != null ? ` · ${fmtNum(meanV, 1)} m/s` : ''}</title></path>`;
  });
  for (const [lbl, deg] of [['N', 0], ['E', 90], ['S', 180], ['O', 270]]) {
    const a = rad(deg); s += `<text class="cl" x="${(C + (R + 12) * Math.cos(a)).toFixed(1)}" y="${(C + (R + 12) * Math.sin(a) + 4).toFixed(1)}" text-anchor="middle">${lbl}</text>`;

      <dt>Registros</dt><dd>${tot}</dd></dl></div>`;
}

/* ---------- Gráfica SVG propia (sin librerías) ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
function drawChart(el, pts, o) {
  if (!pts.length) { el.innerHTML = '<p class="small muted" style="padding:18px 6px">No hay datos de esta variable en el periodo elegido.</p>'; return; }
  const W = Math.max(300, el.clientWidth || 360), H = 190, m = { l: 44, r: o.cumulative ? 40 : 10, t: 10, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t === t0 ? t0 + 10 * MIN : pts[pts.length - 1].t;
  const vs = pts.map((p) => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (o.kind === 'bar') { lo = 0; hi = Math.max(hi, 0.2); }
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = (t) => m.l + (t - t0) / (t1 - t0) * pw, Y = (v) => m.t + ph - (v - lo) / (hi - lo) * ph;
  let s = '';
  for (const tv of ticks) s += `<line class="grid" x1="${m.l}" x2="${m.l + pw}" y1="${Y(tv).toFixed(1)}" y2="${Y(tv).toFixed(1)}"/><text class="axis" x="${m.l - 6}" y="${(Y(tv) + 3).toFixed(1)}" text-anchor="end">${fmtNum(tv, Math.abs(hi - lo) < 3 ? 1 : 0)}</text>`;
  // Marcas de tiempo en horas redondas (hora local)
  const span = t1 - t0, want = Math.max(2, Math.floor(pw / 80));
  const stepT = [10 * MIN, 30 * MIN, HORA, 2 * HORA, 3 * HORA, 6 * HORA, 12 * HORA, DIA, 2 * DIA, 7 * DIA, 30 * DIA].find((x) => span / x <= want) || 30 * DIA;
  const tz = new Date(t0).getTimezoneOffset() * MIN;
  for (let t = Math.ceil((t0 - tz) / stepT) * stepT + tz; t <= t1; t += stepT) {
    const x = X(t); if (x < m.l + 14 || x > m.l + pw - 14) continue;
    s += `<line class="grid" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${m.t + ph}" y2="${m.t + ph + 4}"/><text class="axis" x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle">${stepT >= DIA ? fmtDia(t) : (new Date(t).getHours() === 0 ? fmtDia(t) : fmtHora(t))}</text>`;
  }
  if (o.kind === 'bar') {
    const bw = Math.max(1.2, Math.min(14, pw / Math.max(pts.length, 1) * 0.75));
    for (const p of pts) if (p.v > 0) s += `<rect class="bar" x="${(X(p.t) - bw / 2).toFixed(1)}" y="${Y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(lo) - Y(p.v)).toFixed(1)}" rx="1"/>`;
    if (o.cumulative) {
      let acc = 0; const cum = pts.map((p) => ({ t: p.t, v: (acc += p.v) }));
      const cmax = Math.max(acc, 0.2); const ct = niceTicks(0, cmax, 3); const chi = ct[ct.length - 1];
      const YC = (v) => m.t + ph - v / chi * ph;
      s += `<path class="cum" d="${cum.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + YC(p.v).toFixed(1)).join('')}"/>`;
      for (const tv of ct) s += `<text class="axis" x="${W - 4}" y="${(YC(tv) + 3).toFixed(1)}" text-anchor="end">${fmtNum(tv, chi < 3 ? 1 : 0)}</text>`;
    }
  } else {
    const steps = pts.slice(1).map((p, i) => p.t - pts[i].t).sort((a, b) => a - b);
    const gap = (steps[Math.floor(steps.length / 2)] || 10 * MIN) * 3.5;
    let d = '', area = '', segStart = null;
    pts.forEach((p, i) => {
      const brk = i === 0 || p.t - pts[i - 1].t > gap;
      if (brk && segStart != null) area += `L${X(pts[i - 1].t).toFixed(1)} ${Y(lo).toFixed(1)}L${X(segStart).toFixed(1)} ${Y(lo).toFixed(1)}Z`;
      if (brk) { segStart = p.t; area += `M${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`; } else area += `L${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`;
      d += (brk ? 'M' : 'L') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1);
    });
    area += `L${X(pts[pts.length - 1].t).toFixed(1)} ${Y(lo).toFixed(1)}L${X(segStart).toFixed(1)} ${Y(lo).toFixed(1)}Z`;
    s += `<path class="area" style="opacity:.6" d="${area}"/><path class="ln" d="${d}"/>`;
    if (pts.length < 3) for (const p of pts) s += `<circle class="hdot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"/>`;
  }
  for (const p of pts) if (p.q) { const x = X(p.t), y = Math.max(m.t + 6, Math.min(m.t + ph, Y(p.v))); s += `<path class="flag" d="M${x.toFixed(1)} ${(y - 9).toFixed(1)}l5 8h-10z"><title>Fuera de rango</title></path>`; }
  s += `<g id="hov" visibility="hidden"><line class="hover" y1="${m.t}" y2="${m.t + ph}"/><circle class="hdot" r="4"/><text class="tip" y="${m.t + 10}"></text></g><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent" id="hz"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de la variable">${s}</svg>`;
  const svg = el.firstChild, g = svg.querySelector('#hov'), hz = svg.querySelector('#hz');
  const move = (ev) => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W;
    const t = t0 + (x - m.l) / pw * (t1 - t0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    const bx = X(best.t), by = Y(best.v);
    g.setAttribute('visibility', 'visible');
    g.querySelector('line').setAttribute('x1', bx); g.querySelector('line').setAttribute('x2', bx);
    g.querySelector('circle').setAttribute('cx', bx); g.querySelector('circle').setAttribute('cy', by);
    const tx = g.querySelector('text'); tx.textContent = `${fmtFecha(best.t)} · ${fmtNum(best.v, o.dec)} ${o.unit}`;
    const right = bx > m.l + pw * .55; tx.setAttribute('x', right ? bx - 6 : bx + 6); tx.setAttribute('text-anchor', right ? 'end' : 'start');
  };
  hz.addEventListener('pointermove', move); hz.addEventListener('pointerdown', move);
  hz.addEventListener('pointerleave', () => g.setAttribute('visibility', 'hidden'));
}

/* Dos series en la misma gráfica (comparación entre estaciones) */
function drawCompare(el, A, B, o) {
  if (!A.length && !B.length) { el.innerHTML = '<p class="small muted" style="padding:18px 6px">No hay datos de esta variable en el periodo elegido.</p>'; return; }
  const W = Math.max(300, el.clientWidth || 360), H = 200, m = { l: 44, r: 10, t: 10, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const both = A.concat(B), ts = both.map((p) => p.t), vs = both.map((p) => p.v);
  const t0 = Math.min(...ts), t1 = Math.max(...ts) === t0 ? t0 + 10 * MIN : Math.max(...ts);
  const ticks = niceTicks(Math.min(...vs), Math.max(...vs)); const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = (t) => m.l + (t - t0) / (t1 - t0) * pw, Y = (v) => m.t + ph - (v - lo) / (hi - lo) * ph;
  let s = '';
  for (const tv of ticks) s += `<line class="grid" x1="${m.l}" x2="${m.l + pw}" y1="${Y(tv).toFixed(1)}" y2="${Y(tv).toFixed(1)}"/><text class="axis" x="${m.l - 6}" y="${(Y(tv) + 3).toFixed(1)}" text-anchor="end">${fmtNum(tv, Math.abs(hi - lo) < 3 ? 1 : 0)}</text>`;
  const span = t1 - t0, want = Math.max(2, Math.floor(pw / 80));
  const stepT = [10 * MIN, 30 * MIN, HORA, 2 * HORA, 3 * HORA, 6 * HORA, 12 * HORA, DIA, 2 * DIA, 7 * DIA, 30 * DIA].find((x) => span / x <= want) || 30 * DIA;
  const tz = new Date(t0).getTimezoneOffset() * MIN;
  for (let t = Math.ceil((t0 - tz) / stepT) * stepT + tz; t <= t1; t += stepT) {
    const x = X(t); if (x < m.l + 14 || x > m.l + pw - 14) continue;
    s += `<text class="axis" x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle">${stepT >= DIA || new Date(t).getHours() === 0 ? fmtDia(t) : fmtHora(t)}</text>`;
  }
  const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  if (A.length) s += `<path class="ln" d="${path(A)}"/>`;
  if (B.length) s += `<path class="ln2" d="${path(B)}"/>`;
  s += `<g id="hov" visibility="hidden"><line class="hover" y1="${m.t}" y2="${m.t + ph}"/><circle class="hdot" r="4"/><circle class="hdot2" r="4"/><text class="tip" y="${m.t + 10}"></text><text class="tip" y="${m.t + 24}"></text></g><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent" id="hz"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparación entre ${esc(o.names[0])} y ${esc(o.names[1])}">${s}</svg>`;
  const svg = el.firstChild, g = svg.querySelector('#hov'), hz = svg.querySelector('#hz');
  const near = (pts, t) => pts.reduce((b, p) => (!b || Math.abs(p.t - t) < Math.abs(b.t - t) ? p : b), null);
  const move = (ev) => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W;
    const t = t0 + (x - m.l) / pw * (t1 - t0), a = near(A, t), b = near(B, t), bx = X(t);
    g.setAttribute('visibility', 'visible');
    const [ln] = g.querySelectorAll('line'); ln.setAttribute('x1', bx); ln.setAttribute('x2', bx);
    const [c1, c2] = g.querySelectorAll('circle');
    c1.setAttribute('visibility', a ? 'visible' : 'hidden'); c2.setAttribute('visibility', b ? 'visible' : 'hidden');
    if (a) { c1.setAttribute('cx', X(a.t)); c1.setAttribute('cy', Y(a.v)); }
    if (b) { c2.setAttribute('cx', X(b.t)); c2.setAttribute('cy', Y(b.v)); }
    const [t1x, t2x] = g.querySelectorAll('text'); const right = bx > m.l + pw * .55;
    t1x.textContent = `${fmtFecha(t)}`;
    t2x.textContent = `${a ? fmtNum(a.v, o.dec) : '—'} · ${b ? fmtNum(b.v, o.dec) : '—'} ${o.unit}`;
    for (const tx of [t1x, t2x]) { tx.setAttribute('x', right ? bx - 6 : bx + 6); tx.setAttribute('text-anchor', right ? 'end' : 'start'); }
  };
  hz.addEventListener('pointermove', move); hz.addEventListener('pointerdown', move);
  hz.addEventListener('pointerleave', () => g.setAttribute('visibility', 'hidden'));
}

};
