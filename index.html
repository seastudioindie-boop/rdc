/* ================= CSV: lectura inteligente ================= */
function splitCSV(text, delim) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map((r) => r.map((x) => x.trim())).filter((r) => r.some((x) => x !== ''));
}
function detectDelim(line) {
  const cnt = (d) => { let n = 0, q = false; for (const c of line) { if (c === '"') q = !q; else if (!q && c === d) n++; } return n; };
  return [';', ',', '\t', '|'].map((d) => [d, cnt(d)]).sort((a, b) => b[1] - a[1])[0][1] ? [';', ',', '\t', '|'].map((d) => [d, cnt(d)]).sort((a, b) => b[1] - a[1])[0][0] : ',';
}
function toNum(s, decComma) {
  if (s == null) return NaN; s = String(s).trim(); if (!s) return NaN;
  const m = s.match(/^[-+]?\d+(?:[.,]\d+)*(?:[eE][-+]?\d+)?/); if (!m) return NaN;
  let x = m[0];
  if (decComma && x.includes(',')) x = x.replace(/\./g, '').replace(',', '.');
  else if (!decComma && /^[-+]?\d+,\d+$/.test(x)) x = x.replace(',', '.');
  else if (!decComma) x = x.replace(/,/g, '');
  return parseFloat(x);
}
function parseFecha(s, hora) {
  if (s == null) return NaN; s = String(s).trim(); if (hora) s += ' ' + String(hora).trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    if (/[zZ]|[+-]\d{2}:?\d{2}$/.test(s)) { const t = Date.parse(s); if (!Number.isNaN(t)) return t; }
    return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)).getTime();
  }
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap])?\.?\s*m?\.?)?/i);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000; let h = +(m[4] || 0);
    const ap = (m[7] || '').toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0;
    return new Date(y, +m[2] - 1, +m[1], h, +(m[5] || 0), +(m[6] || 0)).getTime();
  }
  if (/^\d{5}(\.\d+)?$/.test(s)) { // número de serie de fecha de Excel
    const u = new Date(Math.round((parseFloat(s) - 25569) * DIA));
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes(), u.getUTCSeconds()).getTime();
  }
  return NaN;
}
/* Reconoce columnas en español o inglés, con o sin unidades */
function guessColumn(h) {
  const n = norm(h);
  if (/^(fecha|date|dia|timestamp|fecha_hora|datetime|tiempo|time)$/.test(n) || /^fecha/.test(n)) return { role: 'fecha' };
  if (/^(hora|hour)$/.test(n)) return { role: 'hora' };
  if (/^(estado|state|status)$/.test(n)) return { role: 'estado' };
  if (/acumulad/.test(n)) return { role: 'ignorar' };
  if (/intensidad/.test(n)) return { role: 'nueva', code: 'INTP', name: 'Intensidad de lluvia', unit: 'mm/h', agg: 'mean' };
  if (/peso/.test(n)) return { role: 'nueva', code: 'PPES', name: 'Precipitación por peso', unit: 'mm', agg: 'sum' };
  if (/gota/.test(n)) return { role: 'nueva', code: 'GOTA', name: 'Gotas por minuto (piezo)', unit: 'gotas/min', agg: 'mean' };
  if (/precip|lluvia|rain|^prec|^pp$/.test(n)) return { role: 'var', code: 'PREC' };
  if (/^(tema|temp|temperatura|t_aire|t)(_|$)|temperatur/.test(n)) return { role: 'var', code: 'TEMA' };
  if (/^(huma|hum|hr|rh)(_|$)|humedad|humidity/.test(n)) return { role: 'var', code: 'HUMA' };
  if (/^(pres|p_atm|patm)(_|$)|presion|pressure|baromet/.test(n)) return { role: 'var', code: 'PRES' };
  if (/^(dirv|wd)(_|$)|direccion|wind_dir|dir_viento/.test(n)) return { role: 'var', code: 'DIRV' };
  if (/^(velv|ws)(_|$)|velocidad|wind_speed|vel_viento|viento/.test(n)) return { role: 'var', code: 'VELV' };
  if (/^(radg|rad)(_|$)|radiacion|irradian|solar/.test(n)) return { role: 'var', code: 'RADG' };
  if (/^(bat|batt|bateria)/.test(n)) return { role: 'nueva', code: 'BATT', name: 'Voltaje de batería', unit: 'V', agg: 'mean' };
  const code = n.replace(/_/g, '').slice(0, 4).toUpperCase() || 'VAR';
  const unit = /_mm_h$/.test(n) ? 'mm/h' : /_mm$/.test(n) ? 'mm' : /_c$/.test(n) ? '°C' : /_pct$/.test(n) ? '%' : /_hpa$/.test(n) ? 'hPa' : '';
  return { role: 'nueva', code, name: h.trim(), unit, agg: 'mean' };
}
/* "Precipitación 0.0, temperatura 18 °C, presión atmosférica 750 hPa" */
function parseInline(text) {
  const parts = text.split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) {
    const m = p.match(/^([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ ._()/-]*?)\s*[:=]?\s*(-?\d+(?:\.\d+)?)\s*([^\d]*)$/);
    if (!m) return null;
    out.push({ name: m[1].trim(), value: parseFloat(m[2]) });
  }
  return out.length ? out : null;
}
function analyzeCSV(text, st) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/).find((l) => l.trim()) || '';
  const delim = detectDelim(firstLine);
  const decComma = delim === ';' || delim === '\t';
  let rows = splitCSV(text, delim);
  const res = { delim, decComma, layout: 'ancho', cols: [], rows: [], needTime: false, warnings: [] };
  if (!rows.length) { res.error = 'El archivo está vacío.'; return res; }
  const isHeader = rows[0].some((c) => c && Number.isNaN(toNum(c, decComma)) && Number.isNaN(parseFecha(c)));
  // Formato en línea: "Precipitación 0.0, temperatura 18"
  if (rows.length <= 2 && !isHeader) { /* números puros: sin encabezado */ }
  const inline = rows.length <= 3 ? parseInline(text.trim()) : null;
  if (inline && inline.length >= 1 && !rows[0].every((c) => /^[A-Za-zÁ-úñÑ _()/%°.-]+$/.test(c))) {
    res.layout = 'enlinea'; res.needTime = true;
    res.cols = inline.map((x, i) => ({ i, header: x.name, ...guessColumn(x.name) }));
    res.rows = [inline.map((x) => String(x.value))];
    return res;
  }
  if (!isHeader) { res.error = 'No encontré la fila de encabezados. La primera fila debe tener los nombres de las columnas, por ejemplo: fecha_hora,precipitacion_mm,temperatura_c'; return res; }
  const header = rows[0]; rows = rows.slice(1);
  const hn = header.map(norm);
  // Formato largo: variable,valor[,fecha]
  const iVar = hn.findIndex((h) => /^(variable|var|medida|parametro)$/.test(h));
  const iVal = hn.findIndex((h) => /^(valor|value|dato|medicion)$/.test(h));
  if (iVar >= 0 && iVal >= 0) {
    res.layout = 'largo';
    const iF = hn.findIndex((h) => /^fecha|^date|^timestamp|^tiempo/.test(h));
    const names = [...new Set(rows.map((r) => r[iVar]).filter(Boolean))];
    res.cols = names.map((nm, i) => ({ i, header: nm, ...guessColumn(nm) }));
    const byTime = new Map();
    for (const r of rows) {
      const key = iF >= 0 ? r[iF] : '__';
      if (!byTime.has(key)) byTime.set(key, new Array(names.length).fill(''));
      byTime.get(key)[names.indexOf(r[iVar])] = r[iVal];
    }
    res.timeRaw = [...byTime.keys()]; res.rows = [...byTime.values()];
    res.needTime = iF < 0;
    return res;
  }
  res.cols = header.map((h, i) => ({ i, header: h, ...guessColumn(h) }));
  // Columnas de texto que no son fecha ni estado → ignorar
  for (const c of res.cols) {
    if (c.role === 'var' || c.role === 'nueva') {
      const sample = rows.slice(0, 20).map((r) => r[c.i]).filter((x) => x !== '' && x != null);
      if (sample.length && sample.every((x) => Number.isNaN(toNum(x, decComma)))) c.role = 'ignorar';
    }
  }
  res.rows = rows;
  const fi = res.cols.find((c) => c.role === 'fecha');
  if (!fi) res.needTime = true;
  return res;
}
function buildReadings(an, st, mapping, baseTime) {
  const fi = an.cols.find((c, k) => mapping[k] === 'fecha'), hi = an.cols.find((c, k) => mapping[k] === 'hora'), ei = an.cols.find((c, k) => mapping[k] === 'estado');
  const iv = (st.intervalMin || 10) * MIN;
  const out = []; let bad = 0, reported = null;
  an.rows.forEach((r, ri) => {
    let t;
    if (an.layout === 'largo' && !an.needTime) t = parseFecha(an.timeRaw[ri]);
    else if (fi) t = parseFecha(r[fi.i], hi ? r[hi.i] : null);
    else t = baseTime - (an.rows.length - 1 - ri) * iv;
    if (Number.isNaN(t)) { bad++; return; }
    if (ei && r[ei.i]) if (!reported || t >= reported.t) reported = { t, v: r[ei.i] };
    an.cols.forEach((c, k) => {
      const m = mapping[k]; if (!m || !m.startsWith('v:')) return;
      const code = m.slice(2); const v = toNum(r[c.i], an.decComma); if (Number.isNaN(v)) return;
      out.push({ t, c: code, v });
    });
  });
  return { readings: out, badDates: bad, reported };
}

function preview(st, fileName, text) {

    <div class="tablewrap"><table class="data"><thead><tr><th>Columna del archivo</th><th>Se guarda como</th></tr></thead><tbody>
      ${an.cols.map((c, k) => `<tr><td>${esc(c.header)}</td><td><select data-k="${k}">${optsFor(c).map(([v, l]) => `<option value="${esc(v)}" ${v === mapping[k] ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></td></tr>`).join('')}

    // Variables nuevas que el archivo trae
    const added = [];
    for (const code of new Set(readings.map((r) => r.c))) {
      if (st.variables.some((v) => v.code === code)) continue;
      const p = presetBy(code); const c = an.cols.find((x) => x.code === code);
      st.variables.push(p ? { ...p } : { code, name: c?.name || code, unit: c?.unit || '', min: -1e9, max: 1e9, agg: c?.agg || 'mean', kind: c?.agg === 'sum' ? 'bar' : 'line' });
      added.push(code);
    }
    const impId = uid();
    const recs = readings.map((r) => ({ k: `${st.id}|${r.c}|${r.t}`, stationId: st.id, c: r.c, t: r.t, v: r.v, q: s2.flag(r) ? 'rango' : '', imp: impId }));
    await DB.putMany('readings', recs);
    await refreshLatest(st, reported);
    const tms = recs.map((r) => r.t);
    await DB.put('imports', { id: impId, stationId: st.id, fileName, at: Date.now(), by: S.user.username, readings: recs.length, flagged: s2.nflag, from: Math.min(...tms), to: Math.max(...tms) });
    await log('Cargó datos', `${st.code}: ${fileName} (${recs.length} valores)`);
    await loadStations();
    toast(`Se guardaron ${recs.length} valores en ${st.code}${added.length ? ` y se agregaron las variables ${added.join(', ')}` : ''}.`);
    replaceWith('estacion', st.id);
  };
}
/* Recalcula últimos valores y lluvia de los últimos 10 min */
async function refreshLatest(st, reported) {
  const all = await DB.byStation('readings', st.id);
  st.latest = {}; st.lastT = null;
  for (const r of all) { const l = st.latest[r.c]; if (!l || r.t > l.t) st.latest[r.c] = { t: r.t, v: r.v, q: r.q }; if (!st.lastT || r.t > st.lastT) st.lastT = r.t; }
  // Solo cuenta como "último valor" el del instante más reciente de la estación
  for (const k of Object.keys(st.latest)) if (st.lastT - st.latest[k].t > DIA) st.latest[k].old = true;
  st.rain10 = st.lastT ? all.filter((r) => r.c === 'PREC' && r.t > st.lastT - 10 * MIN).reduce((a, r) => a + r.v, 0) : 0;
  // Lluvia acumulada en las últimas 24 h de datos de la estación
  st.rain24 = st.latest.PREC ? +all.filter((r) => r.c === 'PREC' && r.t > st.lastT - DIA).reduce((a, r) => a + r.v, 0).toFixed(2) : null;
  if (reported && (!st.reported || reported.t >= st.reported.t)) st.reported = reported;
  await DB.put('stations', st);
}
async function download(name, text, type = 'text/csv') {
  // Dentro del visor de claude.ai las descargas pasan por su capacidad "downloads"; en GitHub Pages o el disco, enlace normal
  const dl = window.claude?.use ? await Promise.race([window.claude.use('downloads'), new Promise((r) => setTimeout(() => r(null), 1500))]).catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: '﻿' + text }); return; }
    catch (e) { if (e?.code !== 'unavailable' && e?.code !== 'not_granted') { if (e?.code !== 'declined') toast('No se pudo descargar: ' + (e?.message || e?.code), true); return; } }
  }
  const url = URL.createObjectURL(new Blob(['﻿' + text], { type: type + ';charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportStation(st, all) {
  const codes = st.variables.map((v) => v.code);
  const byT = new Map(); for (const r of all) { if (!byT.has(r.t)) byT.set(r.t, {}); byT.get(r.t)[r.c] = r.v; }
  const lines = ['fecha_hora,' + st.variables.map((v) => `${v.code}_${norm(v.unit) || 'valor'}`).join(',')];
  for (const t of [...byT.keys()].sort((a, b) => a - b)) lines.push(fmtFecha(t) + ',' + codes.map((c) => byT.get(t)[c] ?? '').join(','));
  download(`${st.code}_${norm(st.name)}.csv`, lines.join('\n'));
  toast('Descargando el CSV de la estación.');
}

const NIVR = { code: 'NIVR', name: 'Nivel del río', unit: 'cm', min: 0, max: 1500, agg: 'mean', kind: 'line' };
async function seedDemo() {
  const have = new Set(S.stations.map((x) => x.code));
  if (DEMO.every((d) => have.has(d.code))) { toast('La red de ejemplo ya está cargada.'); return; }
  const end = Math.floor(Date.now() / (10 * MIN)) * 10 * MIN;
  const rnd = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
  const made = [], all = [];
  for (const d of DEMO) {
    if (have.has(d.code)) continue;
    const vars = d.only === 'prec' ? [{ ...presetBy('PREC') }] : d.only === 'hid' ? [{ ...presetBy('PREC') }, { ...NIVR }] : PRESETS.map((x) => ({ ...x }));
    const st = { id: uid(), createdAt: Date.now(), createdBy: S.user.username, latest: {}, lastT: null, intervalMin: 10, rainAlert: 5,
      maintenance: !!d.maint, demo: true, code: d.code, name: d.name, type: d.type, lat: d.lat, lon: d.lon, alt: d.alt, muni: d.muni, variables: vars };
    st.dept = GEOIDX.at(st.lat, st.lon) || '';
    const stop = end - (d.lagH || 0) * HORA;
    let nivel = 230, wet = 0;
    for (let t = stop - DIA + 10 * MIN; t <= stop; t += 10 * MIN) {
      const h = new Date(t).getHours() + new Date(t).getMinutes() / 60, ago = (end - t) / MIN;
      const sol = Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
      const prec = +d.rain(h, ago, rnd).toFixed(1);
      const add = (c, v) => all.push({ k: `${st.id}|${c}|${t}`, stationId: st.id, c, t, v: +v.toFixed(2), q: '' });
      add('PREC', prec);
      if (d.only === 'hid') { wet = wet * 0.97 + prec; nivel = 230 + 18 * Math.sin((h - 3) / 24 * Math.PI * 2) + wet * 6; add('NIVR', nivel); }
      if (d.only) continue;
      const [tm, ta] = d.T, [w0, wa] = d.wind || [1.5, 3];
      let huma = Math.min(100, (d.hum0 || 95) - 35 * sol * ((d.hum0 || 95) / 95) + (prec ? 8 : 0) + (rnd() - 0.5) * 3);
      if (d.hum104 && t === stop - 5 * HORA) huma = 104; // dato fuera de rango, para ver el control de calidad
      add('TEMA', tm + ta * (sol - 0.35) - (prec ? 1.2 : 0) + (rnd() - 0.5) * 0.4);
      add('HUMA', huma);
      add('PRES', d.P + 1.2 * Math.sin((h - 10) / 12 * Math.PI * 2) + (rnd() - 0.5) * 0.3);
      add('VELV', Math.max(0, w0 + wa * sol + (rnd() - 0.5) * 1.5));
      add('DIRV', ((d.dir + (rnd() - 0.5) * 70) % 360 + 360) % 360);
      add('RADG', Math.max(0, 980 * sol * (prec ? 0.3 : 1) + (rnd() - 0.5) * 40));
    }
    made.push(st);
  }

  for (const st of made) await DB.put('stations', st);
  await DB.putMany('readings', all);
  for (const st of made) {
    const rs = all.filter((r) => r.stationId === st.id);
    await DB.put('imports', { id: uid(), stationId: st.id, fileName: 'datos de ejemplo (generados)', at: Date.now(), by: S.user.username, readings: rs.length, flagged: rs.filter((r) => r.q).length, from: rs[0].t, to: rs[rs.length - 1].t });
    await refreshLatest(st, null);
  }
  await log('Cargó la red de ejemplo', `${made.length} estaciones, últimas 24 h`);
  await loadStations(); toast(`Red de ejemplo cargada: ${made.length} estaciones con datos de las últimas 24 horas.`);
  S.view = [['lista']]; await render(); fitNetwork();
}

function bindChrome() {

  const ub = $('#userBtn'), um = $('#userMenu');
  ub.onclick = (e) => { e.stopPropagation(); um.hidden = !um.hidden; ub.setAttribute('aria-expanded', String(!um.hidden)); };

    if (!$('#modal').hidden || $('#app').hidden) return;
    if (e.key === 'Escape') {
      if (!um.hidden) { um.hidden = true; ub.setAttribute('aria-expanded', 'false'); if (!isTyping(e)) ub.focus(); return; }
      if (S.pickHandler && S.view.length) { stopPick(); toast('Ubicación en el mapa cancelada.'); return; }
      if (S.map) S.map.closePopup();
      return;
    }
    if (isTyping(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    const top = S.view[S.view.length - 1]?.[0];

    if (k === '/') { e.preventDefault(); if (top !== 'lista') { S.view = [['lista']]; render().then(() => $('#q')?.focus()); } else $('#q')?.focus(); }
    else if (k === 'n') { e.preventDefault(); S.view = [['lista']]; go('form'); }
    else if (k === 'f') { e.preventDefault(); fitNetwork(); }
    else if (k === 'i') { e.preventDefault(); ISO.set(!ISO.on); }
    else if (k === 't') { e.preventDefault(); cycleTheme(); }
    else if (k === '?') { e.preventDefault(); openHelp(); }
  });
  um.onclick = async (e) => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    const g = b.dataset.go;
    if (g !== 'tema') um.hidden = true;
    if (g === 'tema') { cycleTheme(); return; }
    if (g === 'ayuda') { openHelp(); return; }
    if (g === 'salir') { await log('Cerró sesión'); session.set(null); S.user = null; S.view = []; um.hidden = true; return showLogin(); }
    if (g === 'mapabase') { const keys = Object.keys(BASES); setBase(keys[(keys.indexOf(S.base) + 1) % keys.length]); return; }
    S.view = [['lista']]; go(g);
  };
  window.addEventListener('resize', () => S.map && S.map.invalidateSize());
}

  applyTheme(store.get('theme') || 'auto');
  if (!window.L) { document.body.innerHTML = '<p style="padding:24px">No se pudo cargar la librería del mapa (Leaflet). Revisa la conexión o que la carpeta <code>vendor</code> esté junto a index.html.</p>'; return; }
  await DB.init();
  bindChrome();
  const u = session.get();
  // Ingreso solo con cuenta registrada: se retira la cuenta de invitado que dejaban versiones anteriores
  const guest = await DB.get('users', 'invitado');
  if (guest?.guest) { await DB.del('users', 'invitado'); if (u === 'invitado') session.set(null); }
  const su = session.get();
  if (su) { const rec = await DB.get('users', su); if (rec && !rec.guest) { S.user = { username: rec.username, name: rec.name }; return startApp(); } }
  showLogin();
})();

</script>
